<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 竖店短剧</title>
  <link rel="stylesheet" href="css/common.css">
  <style>
    body { background: #fff; }
    .phone-wrap { background: #fff; }

    .login-hero {
      height: 280px;
      background: linear-gradient(135deg, #C8252C 0%, #A81B22 50%, #2C1810 100%);
      position: relative;
      overflow: hidden;
      padding: 0 24px;
    }
    .login-hero::before {
      content: '';
      position: absolute;
      bottom: -50%; left: -20%;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212, 162, 76, 0.3) 0%, transparent 70%);
    }
    .login-hero .status-bar { color: #fff; }
    .login-hero .top {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      color: #fff;
      font-size: 18px;
    }
    .logo-block {
      text-align: center;
      padding: 32px 0 16px;
      color: #fff;
      position: relative;
      z-index: 2;
    }
    .logo-block .logo-icon {
      width: 72px; height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, #FCE6A2, #D4A24C);
      color: #A81B22;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
      font-weight: 900;
      margin: 0 auto 12px;
      box-shadow: 0 8px 24px rgba(212, 162, 76, 0.4);
    }
    .logo-block .name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .logo-block .slogan {
      font-size: 12px;
      opacity: 0.85;
      margin-top: 6px;
    }

    .login-form {
      padding: 24px;
      margin-top: -30px;
      background: #fff;
      border-radius: 24px 24px 0 0;
      position: relative;
      z-index: 3;
      min-height: calc(100vh - 250px);
    }
    .login-tabs {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
    }
    .login-tab {
      font-size: 16px;
      color: var(--text-3);
      padding-bottom: 6px;
      position: relative;
    }
    .login-tab.active {
      color: var(--text-1);
      font-weight: 700;
    }
    .login-tab.active::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: 3px;
      background: var(--primary);
      border-radius: 2px;
    }

    /* 一键登录 */
    .quick-login {
      text-align: center;
      padding: 40px 0 30px;
    }
    .quick-login .avatar-circle {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #07C160, #4FD896);
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      font-size: 28px;
      margin: 0 auto 16px;
    }
    .quick-login .wx-tip {
      font-size: 14px;
      color: var(--text-2);
      margin-bottom: 4px;
    }
    .quick-login .wx-user {
      font-size: 12px;
      color: var(--text-3);
    }

    .input-group {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
      margin-bottom: 8px;
    }
    .input-group .prefix {
      font-size: 14px;
      color: var(--text-2);
      flex-shrink: 0;
    }
    .input-group input {
      flex: 1;
      font-size: 15px;
      color: var(--text-1);
      padding: 4px 0;
    }
    .input-group input::placeholder {
      color: var(--text-4);
    }
    .input-group .code-btn {
      padding: 6px 10px;
      border: 1px solid var(--primary);
      color: var(--primary);
      border-radius: 14px;
      font-size: 12px;
      flex-shrink: 0;
    }
    .input-group .code-btn.disabled {
      border-color: var(--line);
      color: var(--text-3);
    }

    .agree-row {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin: 16px 0;
      font-size: 11px;
      color: var(--text-3);
      line-height: 1.5;
    }
    .agree-row .check-box {
      width: 14px; height: 14px;
      border: 1px solid var(--text-4);
      border-radius: 3px;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      font-size: 10px;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .agree-row .check-box.checked {
      background: var(--primary);
      border-color: var(--primary);
    }
    .agree-row a {
      color: var(--primary);
    }

    .login-btn {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff;
      border-radius: 24px;
      font-size: 16px;
      font-weight: 600;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .wx-login-btn {
      width: 100%;
      height: 48px;
      background: #07C160;
      color: #fff;
      border-radius: 24px;
      font-size: 16px;
      font-weight: 600;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .other-login {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-3);
    }
    .other-login .icons {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 12px;
    }
    .other-login .icon-item {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }

    .footer-tip {
      position: absolute;
      bottom: 24px; left: 0; right: 0;
      text-align: center;
      font-size: 11px;
      color: var(--text-4);
      line-height: 1.7;
    }

    .panel-hidden { display: none; }
  </style>
</head>
<body>
  <div class="phone-wrap">
    <!-- 顶部 -->
    <div class="login-hero">
      <div class="status-bar">
        <span class="time">9:41</span>
        <span class="icons"><span style="margin-right:4px">●●●●</span><span style="margin-right:4px">📶</span><span>🔋</span></span>
      </div>
      <div class="top">
        <span onclick="goBack()">‹</span>
        <span>⋯</span>
      </div>
      <div class="logo-block">
        <div class="logo-icon">竖</div>
        <div class="name">竖店短剧</div>
        <div class="slogan">铜官窑古镇 · 短剧 · 教学 · 景区</div>
      </div>
    </div>

    <!-- 登录区 -->
    <div class="login-form">
      <div class="login-tabs">
        <div class="login-tab active" data-tab="wx">微信登录</div>
        <div class="login-tab" data-tab="phone">手机号登录</div>
      </div>

      <!-- 微信一键登录 -->
      <div id="panel-wx">
        <div class="quick-login">
          <div class="avatar-circle">💬</div>
          <div class="wx-tip">微信用户 · 点击一键登录</div>
          <div class="wx-user">未注册微信号将自动创建账号</div>
        </div>

        <div class="agree-row">
          <div class="check-box checked">✓</div>
          <div>
            我已阅读并同意
            <a href="#">《用户服务协议》</a>、<a href="#">《隐私政策》</a>
            和 <a href="#">《儿童个人信息保护规则》</a>
          </div>
        </div>

        <button class="wx-login-btn" onclick="navigate('index.html')">
          💬 微信一键登录
        </button>

        <div class="other-login">
          <span>——— 其他登录方式 ———</span>
          <div class="icons">
            <div class="icon-item">📱</div>
            <div class="icon-item">📧</div>
            <div class="icon-item">QQ</div>
          </div>
        </div>
      </div>

      <!-- 手机号登录 -->
      <div id="panel-phone" class="panel-hidden">
        <div class="input-group">
          <span class="prefix">+86</span>
          <input type="tel" placeholder="请输入手机号" maxlength="11">
        </div>
        <div class="input-group">
          <input type="text" placeholder="请输入短信验证码" maxlength="6">
          <button class="code-btn" onclick="sendCode(this)">获取验证码</button>
        </div>

        <div class="agree-row">
          <div class="check-box checked">✓</div>
          <div>
            我已阅读并同意
            <a href="#">《用户服务协议》</a>、<a href="#">《隐私政策》</a>
            和 <a href="#">《儿童个人信息保护规则》</a>
          </div>
        </div>

        <button class="login-btn" onclick="navigate('index.html')">
          登录 / 注册
        </button>

        <div style="text-align:center; margin-top: 20px; font-size: 12px; color: var(--text-3);">
          登录即代表您已成为竖店短剧用户<br>
          首次登录赠送 <span style="color:var(--gold-dark); font-weight:600;">100 积分</span> 新人礼包
        </div>

        <div class="other-login">
          <span>——— 其他登录方式 ———</span>
          <div class="icons">
            <div class="icon-item">💬</div>
            <div class="icon-item">📧</div>
            <div class="icon-item">QQ</div>
          </div>
        </div>
      </div>

      <div class="footer-tip">
        长沙铜官窑古镇运营 · 服务热线 400-888-XXXX<br>
        © 2026 竖店短剧 v1.0.0
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    document.querySelectorAll('.login-tab').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        const target = this.dataset.tab;
        document.getElementById('panel-wx').classList.toggle('panel-hidden', target !== 'wx');
        document.getElementById('panel-phone').classList.toggle('panel-hidden', target !== 'phone');
      });
    });
    document.querySelectorAll('.agree-row .check-box').forEach(box => {
      box.addEventListener('click', function() {
        this.classList.toggle('checked');
        if (this.classList.contains('checked')) {
          this.textContent = '✓';
        } else {
          this.textContent = '';
        }
      });
    });
    function sendCode(btn) {
      let count = 60;
      btn.classList.add('disabled');
      const timer = setInterval(() => {
        btn.textContent = count + 's 后重发';
        count--;
        if (count < 0) {
          clearInterval(timer);
          btn.textContent = '获取验证码';
          btn.classList.remove('disabled');
        }
      }, 1000);
      showToast('验证码已发送');
    }
  </script>
</body>
</html>
